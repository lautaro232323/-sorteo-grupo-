<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorteo del Grupo</title>
<style>
:root{ --bg:#f6f5f2; --card:#fff; --text:#1f2320; --muted:#6b6f6c; --accent:#2f7a4f; --border:#e4e2dc; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#15181a; --card:#1f2325; --text:#eceeec; --muted:#9aa39c; --border:#2c3133; }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
.wrap{max-width:480px;margin:0 auto;padding:32px 20px 60px;}
h1{font-size:1.5rem;margin:0 0 4px;}
p.sub{color:var(--muted);margin:0 0 24px;font-size:.95rem;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:1rem;margin-bottom:10px;}
button{width:100%;padding:12px;border-radius:9px;border:none;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;}
button.secondary{background:transparent;color:var(--muted);border:1px solid var(--border);margin-top:8px;}
ul{list-style:none;padding:0;margin:0;max-height:220px;overflow-y:auto;}
li{padding:9px 4px;border-bottom:1px solid var(--border);font-size:.95rem;}
li:last-child{border-bottom:none;}
.count{color:var(--muted);font-size:.85rem;margin-bottom:8px;}
.winner{background:linear-gradient(135deg,var(--accent),#1f5c3a);color:#fff;text-align:center;padding:24px 16px;border-radius:14px;margin-bottom:16px;}
.winner h2{margin:0 0 6px;font-size:1.3rem;}
.status{font-size:.85rem;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎉 Sorteo del Grupo</h1>
  <p class="sub">Anotate y esperá a que se elija el ganador. Sin dinero de por medio.</p>

  <div id="winnerBox"></div>

  <div class="card">
    <input id="nombre" placeholder="Tu nombre" maxlength="40">
    <input id="telefono" type="tel" placeholder="Tu número de celular" maxlength="20">
    <button id="btnUnirse">Participar</button>
    <p class="status" id="joinStatus"></p>
  </div>

  <div class="card">
    <div class="count" id="count">Cargando participantes...</div>
    <ul id="lista"></ul>
  </div>

  <div class="card">
    <button id="btnSortear">🎲 Sortear ganador</button>
    <button id="btnReset" class="secondary">Reiniciar ganador</button>
    <button id="btnVaciar" class="secondary">Vaciar todo (empezar de cero)</button>
    <p class="status" id="drawStatus"></p>
  </div>
</div>

<script>
async function cargarEstado(){
  const res = await fetch('/api/estado');
  const datos = await res.json();
  render(datos.participantes);
  renderGanador(datos.ganador);
}

function render(participantes){
  document.getElementById('count').textContent = participantes.length + ' participante(s)';
  document.getElementById('lista').innerHTML = participantes
    .map(p => `<li>${p.nombre} — ${p.telefono || 'sin número'}</li>`).join('');
}

function renderGanador(g){
  const box = document.getElementById('winnerBox');
  box.innerHTML = g ? `<div class="winner"><h2>🏆 Ganador</h2><div>${g.nombre} (${g.telefono || 'sin número'})</div></div>` : '';
}

document.getElementById('btnUnirse').onclick = async () => {
  const nombre = document.getElementById('nombre').value.trim();
  const telefono = document.getElementById('telefono').value.trim();
  const status = document.getElementById('joinStatus');
  if(!nombre){ status.textContent = 'Escribí tu nombre.'; return; }
  const res = await fetch('/api/participar', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ nombre, telefono })
  });
  if(res.ok){
    status.textContent = '¡Listo, ya estás participando!';
    document.getElementById('nombre').value='';
    document.getElementById('telefono').value='';
    cargarEstado();
  } else {
    status.textContent = 'No se pudo registrar. Probá de nuevo.';
  }
};

document.getElementById('btnSortear').onclick = async () => {
  const status = document.getElementById('drawStatus');
  const res = await fetch('/api/sortear', { method:'POST' });
  if(res.ok){ status.textContent = '¡Sorteo realizado!'; cargarEstado(); }
  else { status.textContent = 'Todavía no hay participantes.'; }
};

document.getElementById('btnReset').onclick = async () => {
  await fetch('/api/reiniciar-ganador', { method:'POST' });
  document.getElementById('drawStatus').textContent = 'Ganador reiniciado.';
  cargarEstado();
};

document.getElementById('btnVaciar').onclick = async () => {
  if(!confirm('¿Seguro que querés borrar participantes y ganador?')) return;
  await fetch('/api/vaciar-todo', { method:'POST' });
  document.getElementById('drawStatus').textContent = 'Todo reiniciado.';
  cargarEstado();
};

cargarEstado();
setInterval(cargarEstado, 4000); // refresca cada 4s para ver a los nuevos participantes
</script>
</body>
</html>
